name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create stable GitHub Release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-28 build-tools;35.0.0 platform-tools'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      # ------------------------------------------------------------------
      # Generate a consistent debug keystore (cached so signatures match)
      # ------------------------------------------------------------------
      - name: Cache debug keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: ${{ github.workspace }}/debug.keystore
          key: goro-debug-keystore-v1

      - name: Generate debug keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/debug.keystore \
            -alias goro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Goro Android"

      - name: Build APK (all architectures)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          # "android" target builds arm64, armv7, and x86 in one APK
          gomobile build -target=android -o $GITHUB_WORKSPACE/goro-unsigned.apk .

      - name: Sign and align APK
        run: |
          export PATH="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0:$PATH"
          
          # Zipalign
          zipalign -v 4 \
            $GITHUB_WORKSPACE/goro-unsigned.apk \
            $GITHUB_WORKSPACE/goro-aligned.apk
          
          # Sign with consistent debug key
          apksigner sign \
            --ks ${{ github.workspace }}/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            $GITHUB_WORKSPACE/goro-aligned.apk
          
          # Verify
          apksigner verify -v $GITHUB_WORKSPACE/goro-aligned.apk
          aapt dump badging $GITHUB_WORKSPACE/goro-aligned.apk | head -5
          
          mv $GITHUB_WORKSPACE/goro-aligned.apk $GITHUB_WORKSPACE/goro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android
          path: goro.apk
          retention-days: 90

      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build from push to `${{ github.ref_name }}`.
            
            **Download `goro.apk` below and install on your phone.**
            
            **If install fails:** Uninstall any old version first (signature conflict).
            
            **Note:** You must provide your own `data.grf` (RO client assets).
            Place them in `/sdcard/Android/data/com.goro.android/files/` or use
            the in-app file picker on first launch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable release. Uninstall old version before installing.
            Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
