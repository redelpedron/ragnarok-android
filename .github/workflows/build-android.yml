name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create stable GitHub Release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-34 build-tools;35.0.0 platform-tools'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      - name: Build APK with gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          gomobile build -androidapi 34 -target=android/arm64 -o $GITHUB_WORKSPACE/goro-raw.apk .

      - name: Verify manifest in raw APK
        run: |
          export PATH="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0:$PATH"
          echo "=== Raw APK manifest ==="
          aapt dump badging $GITHUB_WORKSPACE/goro-raw.apk

      - name: Align and sign APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0"
          export PATH="$BUILD_TOOLS:$PATH"

          echo "=== Aligning ==="
          zipalign -f -p 4 "$GITHUB_WORKSPACE/goro-raw.apk" "$GITHUB_WORKSPACE/goro-aligned.apk"

          echo "=== Generating keystore ==="
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias goro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Goro Android" \
            -storetype PKCS12

          echo "=== Signing ==="
          apksigner sign \
            --ks "$GITHUB_WORKSPACE/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/goro.apk" \
            "$GITHUB_WORKSPACE/goro-aligned.apk"

          echo "=== Verifying ==="
          apksigner verify --verbose --print-certs "$GITHUB_WORKSPACE/goro.apk"

          echo "=== Final APK info ==="
          aapt dump badging "$GITHUB_WORKSPACE/goro.apk" | head -15

      - name: Rename APK with build number
        run: |
          cp "$GITHUB_WORKSPACE/goro.apk" "$GITHUB_WORKSPACE/goro-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android-build${{ github.run_number }}
          path: goro-build${{ github.run_number }}.apk
          retention-days: 90

      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro-build${{ github.run_number }}.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build #${{ github.run_number }} for Pixel 6 / Android 15+.
            
            **To install:**
            1. **Delete ALL old `goro*.apk` files** from Downloads first
            2. Download `goro-build${{ github.run_number }}.apk` below
            3. Uninstall any old version (Settings → Apps → Goro → Uninstall)
            4. Tap the APK to install
            
            **Note:** Provide your own `data.grf`. Place in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro-build${{ github.run_number }}.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable release #${{ github.run_number }}.
            Delete old APKs from Downloads before installing.
            Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
