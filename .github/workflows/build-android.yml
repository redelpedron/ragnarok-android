name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create stable GitHub Release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-28 build-tools;35.0.0 platform-tools'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      - name: Build APK with gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          # Downgraded to api 28 as requested — still compatible with Android 15+
          gomobile build -androidapi 28 -target=android/arm64 -o $GITHUB_WORKSPACE/goro-raw.apk .

      - name: Patch manifest with apktool and re-sign
        run: |
          set -euo pipefail
          export PATH="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0:$PATH"
          
          echo "=== Downloading apktool ==="
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" -O apktool.jar
          
          echo "=== Decompiling ==="
          java -jar apktool.jar d "$GITHUB_WORKSPACE/goro-raw.apk" -o "$GITHUB_WORKSPACE/goro_decompiled" -f
          
          echo "=== Deleting old signatures ==="
          # CRITICAL: apktool preserves original META-INF in the 'original/' folder.
          # If we don't delete it, apksigner sees existing JAR signatures and skips v1/v2.
          rm -rf "$GITHUB_WORKSPACE/goro_decompiled/original"
          ls -la "$GITHUB_WORKSPACE/goro_decompiled/"
          
          echo "=== Patching manifest ==="
          python3 << 'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          manifest_path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'goro_decompiled', 'AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          NS = '{http://schemas.android.com/apk/res/android}'

          uses_sdk = root.find(f'.//{NS}uses-sdk')
          if uses_sdk is None:
              uses_sdk = ET.SubElement(root, 'uses-sdk')

          # Android 15+ requires targetSdk >= 24. Using 28 for compatibility.
          uses_sdk.set(NS + 'minSdkVersion', '24')
          uses_sdk.set(NS + 'targetSdkVersion', '28')

          tree.write(manifest_path, xml_declaration=True, encoding='utf-8')
          print("Patched: minSdk=24, targetSdk=28")
          PYEOF
          
          echo "=== Recompiling ==="
          java -jar apktool.jar b --use-aapt2 "$GITHUB_WORKSPACE/goro_decompiled" -o "$GITHUB_WORKSPACE/goro_rebuilt.apk"
          
          echo "=== Aligning (4-byte for v2 signing) ==="
          # Use standard 4-byte alignment, NOT page alignment (-p), for v2 compatibility
          zipalign -f 4 "$GITHUB_WORKSPACE/goro_rebuilt.apk" "$GITHUB_WORKSPACE/goro_aligned.apk"
          
          echo "=== Generating keystore ==="
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias goro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Goro Android" \
            -storetype PKCS12
          
          echo "=== Signing (v1 + v2 + v3) ==="
          # --min-sdk-version 24 forces apksigner to include v2 block
          apksigner sign \
            --ks "$GITHUB_WORKSPACE/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out "$GITHUB_WORKSPACE/goro.apk" \
            "$GITHUB_WORKSPACE/goro_aligned.apk"
          
          echo "=== Verifying ==="
          apksigner verify --verbose --print-certs "$GITHUB_WORKSPACE/goro.apk"
          
          echo "=== Final manifest ==="
          aapt dump badging "$GITHUB_WORKSPACE/goro.apk" | head -10

      - name: Rename APK with build number
        run: |
          cp "$GITHUB_WORKSPACE/goro.apk" "$GITHUB_WORKSPACE/goro-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android-build${{ github.run_number }}
          path: goro-build${{ github.run_number }}.apk
          retention-days: 90

      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro-build${{ github.run_number }}.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build #${{ github.run_number }} for Pixel 6 / Android 15+.
            
            **To install:**
            1. **Delete ALL old `goro*.apk` files** from Downloads first
            2. Download `goro-build${{ github.run_number }}.apk` below
            3. Uninstall any old version (Settings → Apps → Goro → Uninstall)
            4. Tap the APK to install
            
            **Note:** Provide your own `data.grf`. Place in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro-build${{ github.run_number }}.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable release #${{ github.run_number }}.
            Delete old APKs from Downloads before installing.
            Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
