name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create stable GitHub Release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-34 build-tools;35.0.0 platform-tools'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      - name: Build APK with gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          gomobile build -androidapi 34 -target=android/arm64 -o $GITHUB_WORKSPACE/goro.apk .

      - name: Verify APK
        run: |
          export PATH="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0:$PATH"
          echo "=== APK Info ==="
          aapt dump badging $GITHUB_WORKSPACE/goro.apk | head -10
          echo ""
          echo "=== Native libraries ==="
          aapt list $GITHUB_WORKSPACE/goro.apk | grep lib/
          echo ""
          echo "=== Signature ==="
          apksigner verify -v $GITHUB_WORKSPACE/goro.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android
          path: goro.apk
          retention-days: 90

      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build for Pixel 6 / Android 15+.
            
            **To install:** Download `goro.apk` below.
            - If you have an old version: **Uninstall it first** (signature conflict)
            - Then tap the APK to install
            
            **Note:** Provide your own `data.grf`. Place in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable release. Uninstall old version before installing.
            Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
