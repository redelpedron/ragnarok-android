name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release?'
        required: false
        default: 'false'
        type: boolean

env:
  GO_VERSION: '1.25'
  NDK_VERSION: '27.0.12077973'
  ANDROID_API_LEVEL: '28'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout this scaffold repo
      # ------------------------------------------------------------------
      - name: Checkout scaffold
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Go
      # ------------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ------------------------------------------------------------------
      # 3. Setup Android SDK & NDK (with cache)
      # ------------------------------------------------------------------
      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ${{ runner.temp }}/android-ndk
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/android-ndk
          cd ${{ runner.temp }}/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-r${{ env.NDK_VERSION }}-linux.zip
          mv android-ndk-r${{ env.NDK_VERSION }} ndk

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ runner.temp }}/android-ndk/ndk" >> $GITHUB_ENV
          echo "ANDROID_HOME=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # 4. Setup Android SDK command-line tools
      # ------------------------------------------------------------------
      - name: Cache Android SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/android-sdk
          key: sdk-${{ runner.os }}

      - name: Download Android SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/android-sdk/cmdline-tools
          cd ${{ runner.temp }}/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest

      - name: Accept licenses & install platform
        run: |
          export PATH="${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # ------------------------------------------------------------------
      # 5. Clone upstream dependencies
      # ------------------------------------------------------------------
      - name: Clone goro & gogpu
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro
          git clone --depth 1 https://github.com/gogpu/gogpu.git ${{ runner.temp }}/gogpu

      # ------------------------------------------------------------------
      # 6. Apply Android patches automatically
      # ------------------------------------------------------------------
      - name: Apply patches
        run: |
          cd ${{ runner.temp }}/gogpu
          git apply $GITHUB_WORKSPACE/patches/0001-gogpu-android-surface.patch || echo "Patch 1 may already be applied"
          cd ${{ runner.temp }}/goro
          git apply $GITHUB_WORKSPACE/patches/0002-goro-android-assets.patch || echo "Patch 2 may already be applied"

      # ------------------------------------------------------------------
      # 7. Configure go.mod with local replacements
      # ------------------------------------------------------------------
      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/gogpu/gogpu=${{ runner.temp }}/gogpu
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      # ------------------------------------------------------------------
      # 8. Build libgoro.so
      # ------------------------------------------------------------------
      - name: Build Go shared library
        run: |
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC="${{ runner.temp }}/android-ndk/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang"
          export CXX="${{ runner.temp }}/android-ndk/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.ANDROID_API_LEVEL }}-clang++"
          export SYSROOT="${{ runner.temp }}/android-ndk/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CGO_CFLAGS="-I$SYSROOT/usr/include"
          export CGO_LDFLAGS="-L$SYSROOT/usr/lib -landroid -llog"

          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a
          cd $GITHUB_WORKSPACE/go-bridge
          go build -o $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libgoro.so             -buildmode=c-shared -trimpath             -ldflags="-s -w"             ./main_android.go

          file $GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libgoro.so

      # ------------------------------------------------------------------
      # 9. Generate Gradle wrapper (if missing) and build APK
      # ------------------------------------------------------------------
      - name: Setup Gradle wrapper
        run: |
          cd $GITHUB_WORKSPACE/android
          if [ ! -f gradlew ]; then
            export PATH="${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:$PATH"
            sdkmanager "gradle" || true
            # Fallback: use the Gradle wrapper generator
            curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE/android
          ./gradlew assembleDebug --no-daemon

      # ------------------------------------------------------------------
      # 10. Upload APK as artifact (always available for 90 days)
      # ------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # ------------------------------------------------------------------
      # 11. Create GitHub Release (manual trigger only)
      # ------------------------------------------------------------------
      - name: Sign APK (debug keystore)
        if: github.event.inputs.release == 'true'
        run: |
          # Generate a debug keystore for release builds
          keytool -genkey -v             -keystore $GITHUB_WORKSPACE/debug.keystore             -alias goro             -keyalg RSA -keysize 2048 -validity 10000             -storepass android -keypass android             -dname "CN=Goro Android"

          # Align and sign
          export PATH="${{ runner.temp }}/android-sdk/build-tools/35.0.0:$PATH"
          zipalign -v 4             $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk             $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug-aligned.apk
          apksigner sign             --ks $GITHUB_WORKSPACE/debug.keystore             --ks-pass pass:android             --key-pass pass:android             $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug-aligned.apk
          mv $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug-aligned.apk              $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/goro-android.apk

      - name: Create Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/goro-android.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          body: |
            Automated build from mobile CI.

            **Note:** You must provide your own `data.grf` (RO client assets).
            Place them in `/sdcard/Android/data/com.goro.android/files/` or use
            the in-app file picker on first launch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
