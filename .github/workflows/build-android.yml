name: Build Android APK

on:
  push:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      release:
        description: "Create stable GitHub Release?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Go
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            platforms;android-34
            build-tools;35.0.0
            platform-tools

      # ------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      # ------------------------------------------------------------
      # Remove conflicting pre-installed NDK
      # ------------------------------------------------------------
      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      # ------------------------------------------------------------
      # Install gomobile
      # ------------------------------------------------------------
      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          export PATH="$PATH:$(go env GOPATH)/bin"

          gomobile version || true
          gomobile init

      # ------------------------------------------------------------
      # Clone upstream goro
      # ------------------------------------------------------------
      - name: Clone upstream goro
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/kivutar/goro.git \
            "${{ runner.temp }}/goro"

      # ------------------------------------------------------------
      # Configure Go module
      # ------------------------------------------------------------
      - name: Setup go.mod
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/go-bridge"

          go mod edit \
            -replace github.com/kivutar/goro=${{ runner.temp }}/goro

          go mod tidy

          echo "=== go.mod ==="
          cat go.mod

      # ------------------------------------------------------------
      # Build raw APK with gomobile
      # ------------------------------------------------------------
      - name: Build APK with gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          export PATH="$PATH:$(go env GOPATH)/bin"

          cd "$GITHUB_WORKSPACE/go-bridge"

          gomobile build \
            -androidapi 34 \
            -target=android/arm64 \
            -o "$GITHUB_WORKSPACE/goro-raw.apk" \
            .

          echo "=== Raw APK ==="
          ls -lh "$GITHUB_WORKSPACE/goro-raw.apk"

      # ------------------------------------------------------------
      # Generate signing keystore
      # ------------------------------------------------------------
      - name: Generate signing keystore
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/goro-release.jks" ]; then
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/goro-release.jks" \
              -alias goro \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Goro Android" \
              -storetype PKCS12
          fi

          echo "=== Keystore ==="
          keytool \
            -list \
            -keystore "$GITHUB_WORKSPACE/goro-release.jks" \
            -storepass android

      # ------------------------------------------------------------
      # Align APK
      # ------------------------------------------------------------
      - name: Align APK
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export PATH="$BUILD_TOOLS:$PATH"

          zipalign \
            -f \
            -p \
            4 \
            "$GITHUB_WORKSPACE/goro-raw.apk" \
            "$GITHUB_WORKSPACE/goro-aligned.apk"

          echo "=== Alignment verification ==="

          zipalign -c -v 4 \
            "$GITHUB_WORKSPACE/goro-aligned.apk"

      # ------------------------------------------------------------
      # Sign APK using APK Signature Scheme v2/v3
      # ------------------------------------------------------------
      - name: Sign APK
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export PATH="$BUILD_TOOLS:$PATH"

          apksigner sign \
            --ks "$GITHUB_WORKSPACE/goro-release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/goro.apk" \
            "$GITHUB_WORKSPACE/goro-aligned.apk"

          echo "=== Signed APK ==="
          ls -lh "$GITHUB_WORKSPACE/goro.apk"

      # ------------------------------------------------------------
      # Verify APK signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export PATH="$BUILD_TOOLS:$PATH"

          echo "=== APK SIGNATURE VERIFICATION ==="

          apksigner verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/goro.apk"

          echo ""
          echo "=== Checking v2/v3 signing ==="

          apksigner verify \
            --verbose \
            "$GITHUB_WORKSPACE/goro.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/apksigner-verification.txt"

          grep -q \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            "$GITHUB_WORKSPACE/apksigner-verification.txt"

          grep -q \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "$GITHUB_WORKSPACE/apksigner-verification.txt"

          echo ""
          echo "=========================================="
          echo " APK SIGNATURE VERIFICATION PASSED"
          echo " v2: true"
          echo " v3: true"
          echo "=========================================="

      # ------------------------------------------------------------
      # Show APK information
      # ------------------------------------------------------------
      - name: Inspect APK
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export PATH="$BUILD_TOOLS:$PATH"

          echo "=== APK BADGING ==="

          aapt dump badging \
            "$GITHUB_WORKSPACE/goro.apk"

          echo ""
          echo "=== APK FILE ==="

          ls -lh "$GITHUB_WORKSPACE/goro.apk"

      # ------------------------------------------------------------
      # Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android
          path: goro.apk
          retention-days: 90

      # ------------------------------------------------------------
      # Automatic prerelease on push
      # ------------------------------------------------------------
      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic Android build.

            Built for:
            - ARM64
            - Android API 34
            - Android 9+ compatible target configuration

            APK is signed using APK Signature Scheme v2/v3.

            If an older installation uses a different signing key,
            uninstall the previous version before installing this APK.

            Data file:
            Place your `data.grf` in:

            /sdcard/Android/data/com.goro.android/files/

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Stable release
      # ------------------------------------------------------------
      - name: Stable release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable Android release.

            Built for:
            - ARM64
            - Android API 34

            APK is signed using APK Signature Scheme v2/v3.

            If an older installation uses a different signing key,
            uninstall the previous version before installing this APK.

            Data file:
            Place your `data.grf` in:

            /sdcard/Android/data/com.goro.android/files/

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}