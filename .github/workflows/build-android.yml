name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create stable GitHub Release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platforms;android-34 build-tools;35.0.0 platform-tools'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Remove conflicting pre-installed NDK
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724 || true
          rm -rf /usr/local/lib/android/sdk/ndk-bundle || true

      - name: Install gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      - name: Build APK with gomobile
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          gomobile build -androidapi 34 -target=android/arm64 -o $GITHUB_WORKSPACE/goro-raw.apk .

      - name: Fix APK manifest and re-sign with v2/v3
        run: |
          export PATH="${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0:$PATH"
          
          # Install apktool to decompile/recompile the manifest
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          
          # Decompile gomobile's APK
          java -jar apktool.jar d $GITHUB_WORKSPACE/goro-raw.apk -o $GITHUB_WORKSPACE/goro_decompiled -f
          
          # Fix the manifest: force minSdk and targetSdk to 34
          sed -i 's/android:minSdkVersion="[^"]*"/android:minSdkVersion="34"/g' $GITHUB_WORKSPACE/goro_decompiled/AndroidManifest.xml
          
          # Add targetSdkVersion if missing
          if ! grep -q 'android:targetSdkVersion' $GITHUB_WORKSPACE/goro_decompiled/AndroidManifest.xml; then
            sed -i 's/<uses-sdk /<uses-sdk android:targetSdkVersion="34" /g' $GITHUB_WORKSPACE/goro_decompiled/AndroidManifest.xml
          else
            sed -i 's/android:targetSdkVersion="[^"]*"/android:targetSdkVersion="34"/g' $GITHUB_WORKSPACE/goro_decompiled/AndroidManifest.xml
          fi
          
          # Also fix package name from org.golang.todo.* to something cleaner
          sed -i 's/package="org.golang.todo.goro_android_port"/package="com.goro.android"/g' $GITHUB_WORKSPACE/goro_decompiled/AndroidManifest.xml
          
          # Recompile
          java -jar apktool.jar b $GITHUB_WORKSPACE/goro_decompiled -o $GITHUB_WORKSPACE/goro_rebuilt.apk
          
          # Align
          zipalign -v 4 $GITHUB_WORKSPACE/goro_rebuilt.apk $GITHUB_WORKSPACE/goro_aligned.apk
          
          # Generate consistent debug keystore
          keytool -genkey -v \
            -keystore $GITHUB_WORKSPACE/debug.keystore \
            -alias goro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Goro Android" 2>/dev/null || true
          
          # Sign with v2 + v3 (required for Android 11+)
          apksigner sign \
            --ks $GITHUB_WORKSPACE/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out $GITHUB_WORKSPACE/goro.apk \
            $GITHUB_WORKSPACE/goro_aligned.apk
          
          # Verify
          echo "=== APK Verification ==="
          apksigner verify -v $GITHUB_WORKSPACE/goro.apk
          echo ""
          echo "=== APK Info ==="
          aapt dump badging $GITHUB_WORKSPACE/goro.apk | head -15

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goro-android
          path: goro.apk
          retention-days: 90

      - name: Auto pre-release on push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: auto-${{ github.run_number }}
          name: Auto Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic build for Pixel 6 / Android 15+.
            
            **To install:** Download `goro.apk` below.
            - If you have an old version: **Uninstall it first** (signature conflict)
            - Then tap the APK to install
            
            **Note:** Provide your own `data.grf`. Place in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          prerelease: false
          body: |
            Stable release. Uninstall old version before installing.
            Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
