plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goro.android'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.goro.android"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                // We don't use CMake for the Go binary, but the NDK toolchain
                // is still needed for ANativeWindow headers
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Packaging the Go binary as a shared library
    sourceSets.main {
        jniLibs.srcDir 'src/main/jniLibs'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.0'
}
