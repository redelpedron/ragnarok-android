name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone upstream goro
        run: |
          git clone --depth 1 https://github.com/kivutar/goro.git ${{ runner.temp }}/goro

      - name: Setup go.mod
        run: |
          cd $GITHUB_WORKSPACE/go-bridge
          go mod edit -replace github.com/kivutar/goro=${{ runner.temp }}/goro
          go mod tidy

      - name: Build APK with gomobile
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd $GITHUB_WORKSPACE/go-bridge
          # gomobile handles manifest, activity, and APK packaging
          gomobile build -target=android/arm64 -o $GITHUB_WORKSPACE/goro.apk .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goro-android
          path: goro.apk
          retention-days: 90

      - name: Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: goro.apk
          tag_name: v${{ github.run_number }}
          name: Goro Android v${{ github.run_number }}
          body: |
            Gomobile build. Place `data.grf` in `/sdcard/Android/data/com.goro.android/files/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
